[package]
name = "pingrail"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "Multi-target ping and route monitor (PingPlotter-style) with a TUI, web UI, background service and PDF/PNG reports"
authors = ["Ulrich Holtzhausen <98807810+ulrich-za@users.noreply.github.com>"]
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
dns-lookup = "4.0.2"
getrandom = "0.3"
hex = "0.4.3"
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server", "http1", "tokio", "service", "server-graceful"] }
libc = "0.2.191"
pdf-writer = "0.12"
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# TLS: rustls with the ring crypto backend (Apache-2.0 AND ISC) instead of the
# default aws-lc backend.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto", "x509-parser"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
x509-parser = "0.18"
ring = "0.17"
rustls-platform-verifier = "0.7"
resvg = "0.45"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
svg2pdf = "0.13.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
toml = "1.1.8"
# Passkeys. webauthn-rs (MPL-2.0) uses OpenSSL (Apache-2.0), which is
# compiled in ("vendored") so nothing has to be installed alongside pingrail.
webauthn-rs = { version = "0.5.5", default-features = false, features = ["conditional-ui"] }
openssl = { version = "0.10", features = ["vendored"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
embed-resource = "3.0.12"

# ---------------------------------------------------------------------------
# Debian / Ubuntu / Raspberry Pi OS package (cargo deb)
# ---------------------------------------------------------------------------
[package.metadata.deb]
name = "pingrail"
maintainer = "Ulrich Holtzhausen <98807810+ulrich-za@users.noreply.github.com>"
copyright = "2026 Ulrich Holtzhausen"
section = "net"
priority = "optional"
depends = "libc6 (>= 2.28), libcap2-bin, adduser, fonts-dejavu-core"
recommends = "acl"
# pingrail was called hopwatch: installing it removes hopwatch, and the
# first start imports hopwatch's data (/var/lib/hopwatch is left in place).
conflicts = "hopwatch"
replaces = "hopwatch"
license-file = ["LICENSE", "0"]
extended-description = """\
pingrail pings many hosts at once and traces the route to each of them,
recording latency, jitter, packet loss and MOS for every hop. It has a
terminal UI, a background service with a password-protected web UI, and
exports PDF/PNG reports for any time range."""
maintainer-scripts = "packaging/linux/debian"
assets = [
    ["target/release/pingrail", "usr/bin/", "755"],
    ["packaging/linux/pingrail.service", "lib/systemd/system/pingrail.service", "644"],
    ["packaging/linux/pingrail.toml", "usr/share/pingrail/pingrail.toml.example", "644"],
    ["README.md", "usr/share/doc/pingrail/README.md", "644"],
    ["NOTICE", "usr/share/doc/pingrail/NOTICE", "644"],
    ["THIRD-PARTY-NOTICES.txt", "usr/share/doc/pingrail/THIRD-PARTY-NOTICES.txt", "644"],
]
conf-files = []
