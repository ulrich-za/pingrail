name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Attaching the packages to the release needs write access to the repo's contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wixl
          rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu aarch64-unknown-linux-gnu
          pip install ziglang
          cargo install cargo-deb cargo-zigbuild cargo-audit --locked
      - name: Test
        run: cargo test --release
      - name: Audit dependencies (RustSec)
        run: cargo audit
      - name: Build packages
        run: packaging/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pingrail-packages
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
